<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escenarios Prospectivos — El Mundo Pos-Dólar</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg:        #020405; 
  --panel:     #081216;
  --green:     #00ff88;
  --muted:     #7ba68e; 
  --border:    #1a3324;
  --white:     #eaf2ea; 
  --amber:     #ffaa00;
  --red:       #ff3333;
  --blue:      #0088ff;
  --purple:    #aa66ff;
  --scan:      rgba(0,255,136,0.015);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:'Share Tech Mono',monospace;}

body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px); }

#app-container { display: flex; height: calc(100vh - 30px); width: 100vw; }
#map-container { flex: 1; position: relative; background: var(--bg); }
#map { width: 100%; height: 100%; }

#side-panel {
  width: 420px; background: linear-gradient(90deg, #000 0%, var(--panel) 100%);
  border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000;
}
.panel-header { padding: 20px 20px 15px; border-bottom: 1px solid var(--border); }
.h-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
.h-sub { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-top: 5px; }

.scenario-selector { padding: 15px 20px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-scen {
  background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--muted);
  font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 10px;
  cursor: pointer; transition: all 0.3s; text-align: left; letter-spacing: 1px;
}
.btn-scen:hover { border-color: var(--white); color: var(--white); }
.btn-scen.active-A { background: rgba(0,136,255,0.1); border-color: var(--blue); color: var(--blue); border-left: 3px solid var(--blue); }
.btn-scen.active-B { background: rgba(255,170,0,0.1); border-color: var(--amber); color: var(--amber); border-left: 3px solid var(--amber); }
.btn-scen.active-C { background: rgba(255,51,51,0.1); border-color: var(--red); color: var(--red); border-left: 3px solid var(--red); }
.btn-scen.active-D { background: rgba(170,102,255,0.1); border-color: var(--purple); color: var(--purple); border-left: 3px solid var(--purple); }

.content-area { padding: 20px; flex: 1; overflow-y: auto; }
.s-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; margin-bottom: 15px; letter-spacing: 1px; }
.s-desc { font-size: 13px; line-height: 1.6; color: var(--white); margin-bottom: 20px; text-align: justify; }
.s-bullet { margin-bottom: 12px; padding-left: 10px; border-left: 2px solid var(--muted); font-size: 12.5px; line-height: 1.5; color: #a9c2b3;}
.s-bullet strong { color: var(--white); }

.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.metric-box { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 10px; }
.m-label { font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; }
.m-value { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }

#ticker {
  position: fixed; bottom: 0; left: 0; right: 0; height: 30px;
  background: #000; border-top: 1px solid var(--green); z-index: 1100;
  display: flex; align-items: center; overflow: hidden;
}
.ticker-wrap { white-space: nowrap; animation: ticker 40s linear infinite; font-size: 11px; color: var(--green); letter-spacing: 1px; }
@keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

.leaflet-popup-content-wrapper { background:#081216; border:1px solid var(--border); border-radius:0; }
.leaflet-popup-content { font-family:'Share Tech Mono',monospace; font-size:13px !important; line-height:1.5 !important; color:var(--white); margin:12px; }
.leaflet-popup-tip { background:#081216; }

@media (max-width: 768px) {
  #app-container { flex-direction: column; }
  #side-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); height: 55vh; order: 2; }
  #map-container { height: 45vh; order: 1; }
}
</style>
</head>
<body>

<div id="app-container">
  <div id="map-container"><div id="map"></div></div>

  <div id="side-panel">
    <div class="panel-header">
      <div class="h-title">PROSPECTIVA ESTRATÉGICA</div>
      <div class="h-sub">SIMULADOR DE RIESGO: EL ORDEN POS-YEDA</div>
    </div>
    
    <div class="scenario-selector">
      <button class="btn-scen" id="btn-A" onclick="loadScenario('A')">01 // EL BLINDAJE</button>
      <button class="btn-scen" id="btn-B" onclick="loadScenario('B')">02 // LA FRACTURA</button>
      <button class="btn-scen" id="btn-C" onclick="loadScenario('C')">03 // EL ABISMO</button>
      <button class="btn-scen" id="btn-D" onclick="loadScenario('D')">04 // LA SUPERPOSICIÓN</button>
    </div>

    <div class="content-area">
      <div class="s-title" id="s-title">---</div>
      <div class="s-desc" id="s-desc">---</div>
      <div id="s-bullets"></div>
      
      <div class="metrics-grid" style="margin-top: 20px;">
        <div class="metric-box"><div class="m-label">HEGEMONÍA DÓLAR</div><div class="m-value" id="m-dollar">--</div></div>
        <div class="metric-box"><div class="m-label">RIESGO SISTÉMICO</div><div class="m-value" id="m-risk">--</div></div>
      </div>
    </div>
  </div>
</div>

<div id="ticker"><div class="ticker-wrap" id="ticker-text"></div></div>

<script>
const map = L.map('map', {zoomControl: false, attributionControl: false}).setView([20, 10], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

let currentLayers = [];
function clearMap() { currentLayers.forEach(l => map.removeLayer(l)); currentLayers = []; }

// ── GEOMETRÍA CORREGIDA (Polígonos limpios sin auto-intersección) ──
const polyNorthAmerica = [[70,-170], [70,-50], [15,-50], [15,-170]];
const polyEurope = [[70,-10], [70,40], [35,40], [35,-10]];
const polyEurasia = [[70,40], [70,150], [15,130], [15,40]];
const polyConoSur = [[-15,-80], [-15,-35], [-55,-35], [-55,-80]];
const polyMidEast = [[35,35], [35,60], [12,60], [12,35]];

const DATA = {
  'A': {
    title: 'EL BLINDAJE', color: 'var(--blue)',
    metrics: { dollar: '85.0%', risk: 'SISTEMÁTICO' },
    ticker: "SANCIONES: $300.000M CONGELADOS A RUSIA ◆ VENEZUELA PIERDE $4.500M EN ORO ◆ SWIFT COMO HERRAMIENTA DISCIPLINARIA",
    desc: `<b>El costo es la soberanía.</b> El sistema financiero (SWIFT) deja de ser un bien público global para convertirse en una herramienta punitiva. El viejo orden exige sumisión total.`,
    bullets: [
      `<strong>La Armafización:</strong> Congelamientos masivos fuerzan a los no-alineados a elegir entre disciplina financiera occidental o la expulsión del sistema.`,
      `<strong>El Dilema Argentino:</strong> La presión por un alineamiento incondicional al bloque SWIFT amenaza directamente la arquitectura de reservas del BCRA (dependiente del swap con China). La "apertura al mundo" requiere ceder autonomía.`
    ],
    render: () => {
      currentLayers.push(L.polygon([polyNorthAmerica, polyEurope], {color: '#0088ff', fillColor: '#0088ff', fillOpacity: 0.15, weight: 2}).bindPopup("<b>Núcleo SWIFT / OTAN</b><br>Bloque blindado.").addTo(map));
      currentLayers.push(L.circleMarker([-34,-58], {color: '#0088ff', radius: 8}).bindPopup("<b>Argentina: Tensión de Alineamiento</b><br>Presión para romper lazos financieros asiáticos.").addTo(map));
    }
  },
  'B': {
    title: 'LA FRACTURA', color: 'var(--amber)',
    metrics: { dollar: '45.5%', risk: 'VOLÁTIL' },
    ticker: "FRACTURA OCCIDENTAL: PISTORIUS Y STARMER RECHAZAN CAMPAÑA EN EL GOLFO ◆ MBRIDGE Y CIPS ACELERAN DESDOLARIZACIÓN",
    desc: `<b>El costo es la incertidumbre.</b> Occidente pierde cohesión militar mientras Eurasia consolida tuberías financieras paralelas (CIPS).`,
    bullets: [
      `<strong>Arquitectura Paralela:</strong> La desdolarización avanza a través de sistemas de liquidación alternativos, fraccionando el comercio mundial.`,
      `<strong>El Costo para la Nación Pivotal:</strong> Argentina se ve forzada a un doble estándar logístico: liquidar exportaciones agroindustriales en dólares hacia Occidente, mientras financia su infraestructura e importaciones con el ecosistema del Yuan. El costo transaccional drena recursos.`
    ],
    render: () => {
      currentLayers.push(L.polygon(polyEurasia, {color: '#ffaa00', fillColor: '#ffaa00', fillOpacity: 0.2, weight: 2}).bindPopup("<b>Bloque Eurasia / BRICS+</b><br>Ecosistema de compensación alternativa.").addTo(map));
      currentLayers.push(L.polyline([[39,-77],[50,10]], {color: '#ff3333', weight: 3, dashArray: '5, 10'}).bindPopup("<b>Fractura Transatlántica</b><br>Negativa europea a intervenir en Medio Oriente.").addTo(map));
      currentLayers.push(L.circleMarker([-34,-58], {color: '#ffaa00', radius: 8}).bindPopup("<b>Argentina: Nación Pivotal</b><br>Obligada a sostener interfaces con ambos sistemas financieros.").addTo(map));
    }
  },
  'C': {
    title: 'EL ABISMO', color: 'var(--red)',
    metrics: { dollar: 'FALLIDO', risk: 'CRÍTICO' },
    ticker: "IRÁN CONDICIONA EL ESTRECHO: SOLO PASAN BUQUES CON LIQUIDACIÓN EN YUANES ◆ PARÁLISIS LOGÍSTICA TRANSOCEÁNICA",
    desc: `<b>El costo es la supervivencia.</b> La exigencia de divisas hostiles para el tránsito seguro colapsa el comercio físico. El sistema global retrocede.`,
    bullets: [
      `<strong>El Ultimátum de Ormuz:</strong> Irán reabre el estrecho bajo una condición letal para Yeda: peaje y liquidación exclusiva en yuanes.`,
      `<strong>Resiliencia del Cono Sur:</strong> Ante el colapso logístico transoceánico, Argentina pasa de ser un exportador periférico a una fortaleza de seguridad calórica y energética (Pampa/Vaca Muerta), aislada del apagón del hemisferio norte pero perdiendo sus mercados tradicionales.`
    ],
    render: () => {
      currentLayers.push(L.polygon(polyMidEast, {color: '#ff3333', fillColor: '#ff3333', fillOpacity: 0.3, weight: 2}).bindPopup("<b>Zona de Atrición Máxima</b>").addTo(map));
      currentLayers.push(L.circleMarker([26,56], {color: '#fff', radius: 10, weight:3}).bindPopup("<b>Estrecho de Ormuz</b><br>Exigencia de Yuanes para tránsito.").addTo(map));
      // Destacamos la zona de resiliencia argentina
      currentLayers.push(L.polygon(polyConoSur, {color: '#00cc66', fillColor: '#00cc66', fillOpacity: 0.3, weight: 2, dashArray: '4,6'}).bindPopup("<b>Cono Sur: Zona de Resiliencia</b><br>Autonomía alimentaria y energética ante el colapso logístico.").addTo(map));
    }
  },
  'D': {
    title: 'LA SUPERPOSICIÓN', color: 'var(--purple)',
    metrics: { dollar: 'FRAGMENTADO', risk: 'REALPOLITIK' },
    ticker: "LA SUPERVIVENCIA NACIONAL EN EL ORDEN MULTIPOLAR ◆ ZONAS DE SACRIFICIO VS. NACIONES PIVOTALES ◆ RESILIENCIA ESTRATÉGICA",
    desc: `<b>La cartografía de la realpolitik.</b> Los escenarios coexisten territorialmente. El sistema no colapsa uniformemente, sino que se fragmenta.`,
    bullets: [
      `<strong>Segmentación Geográfica:</strong> El Norte Global se repliega en el <em>Blindaje</em>, Medio Oriente arde en el <em>Abismo</em>, y Eurasia opera en la <em>Fractura</em>.`,
      `<strong>El Imperativo Nacional:</strong> Las viejas preguntas sobre "cómo integrarse al mundo" han muerto. Para Argentina, asegurar la resiliencia implica abandonar los idealismos y administrar el poder nacional en la intersección de estos tres escenarios.`
    ],
    render: () => {
      currentLayers.push(L.polygon([polyNorthAmerica, polyEurope], {color: '#0088ff', fillColor: '#0088ff', fillOpacity: 0.1, weight: 1}).addTo(map));
      currentLayers.push(L.polygon(polyEurasia, {color: '#ffaa00', fillColor: '#ffaa00', fillOpacity: 0.1, weight: 1}).addTo(map));
      currentLayers.push(L.polygon(polyMidEast, {color: '#ff3333', fillColor: '#ff3333', fillOpacity: 0.2, weight: 1}).addTo(map));
      // Argentina destacada transversalmente
      currentLayers.push(L.polygon(polyConoSur, {color: '#aa66ff', fillColor: '#aa66ff', fillOpacity: 0.4, weight: 3}).bindPopup("<b>República Argentina</b><br>La supervivencia nacional atada a la realpolitik y la gestión de la fractura global.").addTo(map));
    }
  }
};

function loadScenario(id) {
  document.querySelectorAll('.btn-scen').forEach(b => b.className = 'btn-scen');
  document.getElementById('btn-'+id).classList.add('active-'+id);

  const d = DATA[id];
  document.getElementById('s-title').textContent = d.title;
  document.getElementById('s-title').style.color = d.color;
  document.getElementById('s-desc').innerHTML = d.desc;
  
  document.getElementById('s-bullets').innerHTML = d.bullets.map(b => `<div class="s-bullet">${b}</div>`).join('');
  
  document.getElementById('m-dollar').textContent = d.metrics.dollar;
  document.getElementById('m-dollar').style.color = d.color;
  document.getElementById('m-risk').textContent = d.metrics.risk;
  
  document.getElementById('ticker-text').textContent = d.ticker + "   ◆   " + d.ticker;

  clearMap();
  d.render();
}

loadScenario('A');
</script>
</body>
</html>
